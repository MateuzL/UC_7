<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Marketing - Desafio dia 17/08/2026</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .container{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 100px 250px 200px;
            gap: 8px;
            grid-template-areas:
            "cabecalho  cabecalho cabecalho"
            "menu  menu  menu"
            "area-video area-video area-video";
        }

        .cabecalho {
            grid-area: cabecalho;
            background-color: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }

        .menu {
            grid-area: menu;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 10px;
        }

        .area-video {
            width: 100%;
            padding: 20px;
            background-color: #111827;
        }

        .area-video video {
            width: 100%;
            max-height: 500px;
            display: block;
            object-fit: cover;
            border-radius: 10px;
        }



</style>
<body>

    <div class="container">
        <div class="cabecalho">Título do Site</div>
        <div class="menu"></div>
        <div class="area-video">

        <video autoplay muted loop playsinline>
            <source src="EnriqueBannerBKK.mp4" type="video/mp4">

            Seu navegador não suporta vídeos.
        </video>
        </div>

    </div>




    
</body>
</html>
