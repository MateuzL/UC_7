<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Site de Marketing</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* CONTAINER PRINCIPAL */
        .container {
            width: 80%;
            margin: 20px auto;

            display: grid;

            grid-template-columns: 2fr 1fr;
            grid-template-rows: 100px 400px;

            grid-template-areas:
                "cabecalho cabecalho"
                "video lateral";

            gap: 10px;
        }

        /* CABEÇALHO */
        .cabecalho {
            grid-area: cabecalho;

            background-color: #3498db;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 30px;
            font-weight: bold;

            border-radius: 5px;
        }

        /* VÍDEO */
        .video {
            grid-area: video;
            object-fit: cover;
        }

        .video video {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
            border-radius: 5px;
        }

        /* LATERAL */
        .lateral {
            grid-area: lateral;
            background-color: #eeeeee;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
            border-radius: 5px;
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- CABEÇALHO -->
        <div class="cabecalho">
            Marketing
        </div>


        <!-- VÍDEO -->
        <div class="video">

            <video autoplay muted loop playsinline>
                <source src="EnriqueBannerBKK.mp4" type="video/mp4">
            </video>

        </div>


        <!-- LATERAL DIREITA -->
        <div class="lateral">
            Informações do site/empresa
        </div>

    </div>

</body>

</html>
