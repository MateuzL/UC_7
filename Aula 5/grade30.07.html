<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Carros</title>
<style>
    html,body{
        margin: 0;
        padding: 0;
    }

.container{
    width: 90%;
    height: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin: auto;
    gap: 10px;
    margin-top: 30px;}

.item{
    width: 30%;
    color: azure;
    height: 50%;}

.fotos{
    width: 100%;
    height: 200px;
    overflow: hidden;    
    border-radius: 10px;
    box-shadow: 5px 4px 5px 2px rgba(48, 46, 46, 0.5);}

    .fotos img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.85;
        transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .fotos:hover img {
        transform: scale(1.2);
        opacity: 1;
    }

    @media(max-width:768px) {       /* Para reduzir o tamanho da tela quando atingir 900px, uma tela de tablet por exemplo */
        .container{
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media(max-width:360px) {       
        .container{
            grid-template-columns: repeat(1, 1fr);
        }

    }

    @media(max-width:768px){
    .container2{
        grid-template-columns: repeat(1, 1fr);
    }
}

.container2{
    width: 100%;
    height: auto;

    margin: auto;
    gap: 5px;

.cabecalho{
    width: 100%;
    height: 150px;
    background-color: #b4acac;
    color: white;
    display: grid;
    border-radius: 10px;
    font-size: 40px;}

</style>
</head>
