<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Avaliacao</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 20px;
    text-align: center;
}

h1{
    margin-bottom: 20px;
}

.painel-principal{
    display: grid;
    grid-template-columns: 180px 1fr 1fr;
    grid-template-rows: 120px 220px 180px 120px;
    gap: 15px;
    grid-template-areas:
        "topo topo topo"
        "lateral centro centro"
        "lateral centro2 centro3"
        "rodape rodape rodape";
}

.topo-site{
    grid-area: topo;
}

.menu-lateral{
    grid-area: lateral;
}

.conteudo-destaque{
    grid-area: centro;
}

.noticia-esquerda{
    grid-area: centro2;
}

.noticia-direita{
    grid-area: centro3;
}

.rodape{
    grid-area: rodape;
}



.topo-site,
.menu-lateral,
.conteudo-destaque,
.noticia-esquerda,
.noticia-direita,
.rodape{
    background-color: #b7d8f5;
    border: 2px solid #333;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    font-weight: bold;
}

    </style>
</head>
<body>

    <h1>Layout Avaliacao</h1>

    <div class="painel-principal">

        <div class="topo-site">
            Início
        </div>

        <div class="menu-lateral">
            Lado esquerdo
        </div>

        <div class="conteudo-destaque">
            Centro - Principal
        </div>

        <div class="noticia-esquerda">
            Central 2
        </div>

        <div class="noticia-direita">
            Central 3
        </div>

        <div class="rodape">
            Footer/Rodapé
        </div>

    </div>

</body>
</html>
